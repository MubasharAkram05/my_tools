  if(D.c){pc=+D.c;pi=0;render();return}
  if(D.g!==undefined){openL(+D.g);return}
  if(D.o!==undefined){pick(+D.o);return}
  if(D.k!==undefined){tile(D.k);return}
  if(a==="listen")say(curS());
  if(a==="slow")say(curS(),.55);
  if(a==="rec")mic(curS());
  if(a==="chk"){var iv=document.getElementById("ti").value.trim();if(iv)after(showRes(curS(),iv))}
  if(a==="mm"){S.mic=S.mic==="demo"?"real":"demo";save();render()}
  if(a==="pn"){pi++;render()}
  if(a==="wl")say(L.steps[L.i].w[0]);
  if(a==="cont"||a==="nx")nx();
  if(a==="ck")ck();
  if(a==="retry"){regen();if(S.hearts>0)openL(L.g)}
  if(a==="x"){document.getElementById("ls").style.display="none";inL=false;try{speechSynthesis.cancel()}catch(x){}render()}
  if(a==="reset"){S={xp:0,streak:0,last:"",spoken:0,done:0,hearts:25,goal:0,mic:S.mic,mv:S.mv,en2:1,ets:Date.now()};save();render()}
});

},1000);
