<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debate Practice Bot</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #232526, #414345);
    color: #fff;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 24px 20px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
  p.subtitle {
    opacity: 0.8;
    margin: 0 0 18px;
    font-size: 13px;
    line-height: 1.5;
    text-align: left;
    background: rgba(0,0,0,0.2);
    padding: 12px 14px;
    border-radius: 12px;
  }
  p.subtitle b { color: #7bdcff; }
  label { font-size: 13px; opacity: 0.85; display: block; margin-bottom: 6px; }
  select, input[type="text"] {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    margin-bottom: 14px;
    background: #1e1e1e;
    color: #fff;
  }
  .side-buttons { display: flex; gap: 10px; margin-bottom: 6px; }
  .side-buttons button {
    flex: 1;
    padding: 14px 8px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    transition: transform 0.15s ease;
  }
  .side-buttons button:active { transform: scale(0.95); }
  #startForBtn { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 4px 15px rgba(17,153,142,0.4); }
  #startAgainstBtn { background: linear-gradient(135deg, #e52d27, #b31217); box-shadow: 0 4px 15px rgba(229,45,39,0.4); }

  /* Chat UI */
  #chatScreen { display: none; }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .chat-header .topic-name { font-size: 14px; font-weight: bold; opacity: 0.9; }
  #endDebateBtn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .chat-window {
    height: 340px;
    overflow-y: auto;
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    animation: pop 0.2s ease;
  }
  .bubble.bot {
    background: #35424a;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: #0072ff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bubble .who {
    font-size: 10px;
    opacity: 0.6;
    margin-bottom: 3px;
    font-weight: bold;
  }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input {
    flex: 1;
    margin-bottom: 0;
    padding: 12px;
  }
  .chat-input-row button {
    padding: 0 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  .chat-input-row button:active { transform: scale(0.96); }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="card">

  <!-- SETUP SCREEN -->
  <div id="setupScreen">
    <h1>🎙️ Debate Practice Bot</h1>
    <p class="subtitle">
      Topic choose karo, decide karo tum <b>FOR</b> bologe ya <b>AGAINST</b> — bot dusri side lekar tumse poori chat-based debate karega. 100% offline.
    </p>

    <label>Topic Choose Karo:</label>
    <select id="topicSelect" onchange="handleTopicChange()">
      <option value="social_media">Social Media Achi Hai Ya Buri</option>
      <option value="online_classes">Online Classes vs Physical Classes</option>
      <option value="ai_students">Students ko AI Use Karna Chahiye</option>
      <option value="junk_food">Junk Food Ban Hona Chahiye</option>
      <option value="exams">Exams Zaroori Hain Ya Nahi</option>
      <option value="custom">Apna Topic Likho...</option>
    </select>

    <input type="text" id="customTopic" placeholder="Apna topic yahan likho..." style="display:none;">

    <label>Tum Kis Side Se Bologe?</label>
    <div class="side-buttons">
      <button id="startForBtn" onclick="startDebate('for')">✅ Main FOR hoon</button>
      <button id="startAgainstBtn" onclick="startDebate('against')">❌ Main AGAINST hoon</button>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div class="chat-header">
      <div class="topic-name" id="chatTopicLabel">Topic</div>
      <button id="endDebateBtn" onclick="endDebate()">🔚 End Debate</button>
    </div>
    <div class="chat-window" id="chatWindow"></div>
    <div class="chat-input-row">
      <input type="text" id="userMessage" placeholder="Apna argument likho..." onkeypress="if(event.key==='Enter') sendUserMessage()">
      <button onclick="sendUserMessage()">Send</button>
    </div>
  </div>

</div>

<script>
const debateTopics = {
  social_media: {
    label: "Social Media Achi Hai Ya Buri",
    for: [
      "Social media na hota to tumhe pata hi nahi chalta cousin ki engagement kab hui, itni useful cheez hai ye.",
      "Business log social media pe itna paisa kamate hain ke bank manager bhi unko like karta hai.",
      "Social media pe ek hi din mein log expert ban jate hain kisi bhi topic ke, itni fast education hai.",
      "Reels dekh dekh ke logon ki general knowledge itni barh gayi hai ke Google bhi sharminda ho.",
      "Social media na hota to selfies kis ke liye kheenchte, poori generation useless ho jati.",
      "Emergency mein log 'DM me karo' bolte hain, itna reliable system hai ye.",
      "Comment section mein har koi PhD holder lagta hai, kitna talent chupa hua hai duniya mein."
    ],
    against: [
      "Social media pe log itna scroll karte hain ke unki gardan permanent 45 degree pe set ho gayi hai.",
      "Fake news itni fast phailti hai ke sach ko passport lagana chahiye bahar aane ke liye.",
      "Log apni zindagi ka time itna waste karte hain ke calendar bhi confuse ho jata hai kaunsa mahina chal raha hai.",
      "Comment section mein logon ki khoobiyaan aisi nikalti hain ke UN mein complaint honi chahiye.",
      "Privacy ka haal ye hai ke ad khud bata deta hai tumhe kal kya kharidna hai.",
      "Log apni online image itni polish karte hain ke asal zindagi mein pehchan nahi aati.",
      "Comparison itni hoti hai ke bande ko apni hi shaadi ki photo mein doosron ka outfit dikhta hai."
    ]
  },
  online_classes: {
    label: "Online Classes vs Physical Classes",
    for: [
      "Online classes mein camera off karke koi bhi kaam kiya ja sakta hai, itni flexibility kisi job mein nahi milti.",
      "Lecture dobara dekh sakte ho, isliye pehli baar so jao to bhi tension nahi.",
      "Travel time bacha ke seedha bed se class attend karna kisi luxury se kam nahi.",
      "Introvert bande ko mic mute karne ka option milta hai, best invention ever.",
      "Online class mein background mein family ka drama chal raha ho to bhi koi shikayat nahi karta."
    ],
    against: [
      "Physical class mein sir bulate hain to bhaag nahi sakte, online mein 'network issue' bol kar nikal jate ho.",
      "Distractions itni hain ke phone pe game khelte khelte pata hi nahi chalta class khatam ho gayi.",
      "Practical subjects online seekhna aisa hai jaise swimming YouTube video se seekho.",
      "Group projects online mein sirf ek banda kaam karta hai, baaki sab 'available' rehte hain bas naam ke.",
      "Wifi off ho jaye to poori padhai excuse ban jati hai, itna convenient bahana hai ye."
    ]
  },
  ai_students: {
    label: "Students ko AI Use Karna Chahiye",
    for: [
      "AI se assignment 5 minute mein ho jata hai jo pehle raat bhar jaagne se hota tha, time management level unlock.",
      "AI 24/7 available hai, teacher ki tarah 'office hours' ka wait nahi karna padta.",
      "AI se difficult topics itne simple ho jate hain ke lagta hai bachpan se yahi padha tha.",
      "AI se homework karke bhi log khud ko genius samajhte hain, confidence boost free mein."
    ],
    against: [
      "AI par itna depend ho gaye hain log ke calculator bhi bhool gaye kaise use karte hain.",
      "AI kabhi kabhi itna galat jawab deta hai ke exam mein 'creative writing' ka number mil jata hai.",
      "Students AI se copy karke apne aap ko topper samajhte hain, phir exam mein blank paper.",
      "AI se sab kuch karwane ke baad bhi log presentation mein atak jate hain, kyunki khud kuch pata nahi hota."
    ]
  },
  junk_food: {
    label: "Junk Food Ban Hona Chahiye",
    for: [
      "Junk food itna addictive hai ke log diet start karte hi burger ka photo save kar lete hain 'motivation' ke naam pe.",
      "Junk food khane ke baad log gym jaane ka plan banate hain jo kabhi execute nahi hota.",
      "Schools ke bahar junk food stalls dekh kar bachon ki 'healthy lunch' ki tasveer hawa ho jati hai.",
      "Junk food ban ho jaye to log ghar ka khana khane lagenge, revolutionary idea hai ye."
    ],
    against: [
      "Junk food ban kar do to log chori chupi aur zyada khayenge, jaise koi banned movie dekhta hai.",
      "Junk food industry band ho gayi to delivery boys bhi berozgar ho jayenge, sochna chahiye.",
      "Log apni marzi se khud ko nuqsan pohanchane ka haq rakhte hain, ye bhi ek talent hai.",
      "Ban lagne se log black market se pizza mangwayenge, drama level next stage pe chala jayega."
    ]
  },
  exams: {
    label: "Exams Zaroori Hain Ya Nahi",
    for: [
      "Exams na hote to log kabhi kitab khol kar bhi nahi dekhte, ye toh ek zaroori darr hai.",
      "Last night cramming karna ek skill hai jo sirf exams hi develop kar sakte hain.",
      "Exam hall mein pen ka na chalna aur time ka khatam hona, ye bhi character building hai.",
      "Exams ke bina result card mein sirf 'nice person' likha hota, employer confuse ho jata."
    ],
    against: [
      "Exams sirf yeh check karte hain ke raat ko kitna ratta laga tha, samajh ka to koi scene hi nahi.",
      "Exam ka stress itna hota hai ke log apna naam bhi bhool jate hain paper pe likhte waqt.",
      "Har banda alag tarike se seekhta hai, par exam sabko ek hi mould mein daal deta hai jaise cookie cutter ho.",
      "Exam ke baad sab bhool jate hain jo padha tha, matlab poora system sirf temporary memory test hai."
    ]
  }
};

const genericFor = [
  (t) => `"${t}" na ho to log bore ho jayein, itna zaroori hai ye.`,
  (t) => `"${t}" se log free mein smart lagte hain, kya scene hai.`,
  (t) => `"${t}" na hota to time kahan waste karte log, useful bekar hai ye.`,
  (t) => `"${t}" progress hai, chai jaisa — bina iske subah adhoori.`,
  (t) => `"${t}" se time bachta hai, aur scroll zyada hota hai.`,
  (t) => `"${t}" ke memes ban rahe hain, matlab impact to hai.`
];

const genericAgainst = [
  (t) => `"${t}" pe warning label lagna chahiye, cigarette jaisa.`,
  (t) => `"${t}" ka excuse har cheez ke liye ban gaya hai.`,
  (t) => `"${t}" ka fan club bina soche defend karta hai.`,
  (t) => `"${t}" ki wajah se purani cheezein museum lagti hain ab.`,
  (t) => `"${t}" pe log itna depend hain, khud decision bhool gaye.`,
  (t) => `"${t}" ka side effect abhi aana baaki hai, season 2 jaisa.`
];

const rebuttalConnectors = [
  "Bhai ye point WiFi bina password wala nikla 😂 Suno asli baat:",
  "Chai bina cheeni jaisa argument tha yaar. Ab suno:",
  "Guess kiya tha na? Chal gaya nahi. Suno:",
  "Battery low, charger nahi laga — same scene. Suno:",
  "'Traffic tha' wala excuse tha ye. Ab dekho:",
  "Bina cement ke ghar banaya tumne. Girta hai ab:",
  "Load shedding ho gayi tumhari baat ki. On karta hoon:",
  "Rickshaw wala route tha ye, seedha nahi gaya. Suno:",
  "Sabzi wala bhi zyada proof deta hai. Chalo suno:",
  "Horn bajaya, gari nahi chali. Ab dekho asli:",
  "Full drama, zero sense. Suno counter:",
  "Ye toh WhatsApp forward nikla yaar 😂 Suno:"
];

const openingLines = [
  "Chalo shuru karte hain — apna dimaag garam rakhna, kaam aayega 😏 pehla point:",
  "Ready ho? Tumhari baatein main ek ek karke uda dunga. Suno pehla waar:",
  "Bismillah! Belt bandh lo, ye lo pehla point:",
  "Chalo dekhte hain tumhara logic kitni der tikta hai. Suno mera pehla point:"
];

let currentTopicKey = null;
let currentTopicLabel = "";
let currentTopicData = null;
let userSide = null;
let botSide = null;
let usedPools = {};

function pickWithoutRepeat(listId, list) {
  if (!usedPools[listId] || usedPools[listId].length === 0) {
    const indices = list.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    usedPools[listId] = indices;
  }
  const nextIndex = usedPools[listId].pop();
  return list[nextIndex];
}

function handleTopicChange() {
  const select = document.getElementById('topicSelect');
  const customInput = document.getElementById('customTopic');
  customInput.style.display = select.value === 'custom' ? 'block' : 'none';
}

function getBotArgument() {
  let text;
  if (currentTopicKey === 'custom') {
    const listId = "custom_" + botSide;
    const templates = botSide === 'for' ? genericFor : genericAgainst;
    const template = pickWithoutRepeat(listId, templates);
    text = template(currentTopicLabel);
  } else {
    const listId = currentTopicKey + "_" + botSide;
    const list = currentTopicData[botSide];
    text = pickWithoutRepeat(listId, list);
  }
  return text;
}

function addBubble(text, sender) {
  const chatWindow = document.getElementById('chatWindow');
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + sender;
  const whoLabel = sender === 'bot' ? '🤖 Bot' : '🙋 Aap';
  bubble.innerHTML = `<div class="who">${whoLabel}</div>${text}`;
  chatWindow.appendChild(bubble);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function startDebate(side) {
  const select = document.getElementById('topicSelect');
  currentTopicKey = select.value;

  if (currentTopicKey === 'custom') {
    const customText = document.getElementById('customTopic').value.trim();
    if (!customText) {
      alert("Pehle apna topic likho!");
      return;
    }
    currentTopicLabel = customText;
    currentTopicData = null;
  } else {
    currentTopicData = debateTopics[currentTopicKey];
    currentTopicLabel = currentTopicData.label;
  }

  userSide = side;
  botSide = side === 'for' ? 'against' : 'for';
  usedPools = {};

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'block';
  document.getElementById('chatWindow').innerHTML = '';
  document.getElementById('chatTopicLabel').textContent =
    currentTopicLabel + " — Aap: " + (side === 'for' ? 'FOR ✅' : 'AGAINST ❌') +
    " | Bot: " + (botSide === 'for' ? 'FOR ✅' : 'AGAINST ❌');

  const opening = openingLines[Math.floor(Math.random() * openingLines.length)];
  const firstArg = getBotArgument();
  addBubble(opening + " " + firstArg, 'bot');
}

function sendUserMessage() {
  const input = document.getElementById('userMessage');
  const text = input.value.trim();
  if (!text) return;

  addBubble(text, 'user');
  input.value = '';

  setTimeout(() => {
    const connector = rebuttalConnectors[Math.floor(Math.random() * rebuttalConnectors.length)];
    const botArg = getBotArgument();
    addBubble(connector + " " + botArg, 'bot');
  }, 500);
}

function endDebate() {
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'block';
}
</script>

</body>
</html>
