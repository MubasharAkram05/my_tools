<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Call Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #232526, #414345);
    color: #fff;
  }

  /* ---------- Setup screen ---------- */
  .setup {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 420px;
    width: 100%;
    margin: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    text-align: center;
  }
  .setup h1 { font-size: 24px; margin-bottom: 5px; }
  .setup p.subtitle { opacity: 0.75; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    margin-bottom: 15px;
    background: #2b2740;
    color: #fff;
  }
  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: white;
    box-shadow: 0 4px 15px rgba(17,153,142,0.4);
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .delay-row { display: flex; gap: 10px; margin-bottom: 15px; }
  .delay-row button {
    flex: 1;
    font-size: 14px;
    padding: 10px;
    background: rgba(255,255,255,0.12);
    box-shadow: none;
  }
  .delay-row button.active { background: linear-gradient(135deg, #11998e, #38ef7d); }

  /* ---------- Fake call screen ---------- */
  .call-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #000000, #1a1a2e 60%, #16213e);
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 20px 50px;
    text-align: center;
    z-index: 999;
  }
  .call-screen.show { display: flex; }
  .call-top { margin-top: 20px; }
  .call-status { font-size: 15px; opacity: 0.7; margin-bottom: 10px; letter-spacing: 1px; }
  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 54px;
    margin: 15px auto 20px;
    box-shadow: 0 0 0 8px rgba(255,255,255,0.05);
  }
  .caller-name { font-size: 30px; font-weight: 600; margin-bottom: 6px; }
  .caller-number { font-size: 15px; opacity: 0.6; }
  .call-actions {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 320px;
  }
  .call-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .decline { background: #ff3b30; }
  .accept { background: #34c759; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52,199,89,0.5); }
    70% { box-shadow: 0 0 0 18px rgba(52,199,89,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); }
  }
  .call-actions span {
    display: block;
    font-size: 12px;
    margin-top: 8px;
    opacity: 0.7;
  }
  .exit-hint {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 12px;
    opacity: 0.4;
  }
</style>
</head>
<body>

<div class="setup" id="setup">
  <h1>📞 Fake Call Generator</h1>
  <p class="subtitle">Awkward situation se nikalne ka bahana — 100% offline</p>

  <input type="text" id="callerName" placeholder="Caller ka naam (e.g. Ammi)" value="Ammi">
  <input type="text" id="callerNumber" placeholder="Number (optional)" value="+92 300 1234567">

  <select id="ringtoneStyle">
    <option value="urgent">Urgent tone (kaam wala bahana)</option>
    <option value="normal">Normal call</option>
  </select>

  <p style="text-align:left; font-size:13px; opacity:0.7; margin-bottom:8px;">Kitni der baad call aaye:</p>
  <div class="delay-row" id="delayRow">
    <button data-sec="0" class="active">Abhi</button>
    <button data-sec="5">5 sec</button>
    <button data-sec="15">15 sec</button>
    <button data-sec="30">30 sec</button>
  </div>

  <button onclick="scheduleCall()">Call Set Karo</button>
  <p id="countdownMsg" style="margin-top:12px; font-size:13px; opacity:0.8;"></p>
</div>

<div class="call-screen" id="callScreen">
  <div class="exit-hint">tap X to end demo</div>
  <div class="call-top">
    <div class="call-status" id="callStatus">Incoming call...</div>
  </div>

  <div>
    <div class="avatar" id="avatarInitial">A</div>
    <div class="caller-name" id="displayName">Ammi</div>
    <div class="caller-number" id="displayNumber">+92 300 1234567</div>
  </div>

  <div class="call-actions">
    <div>
      <button class="call-btn decline" onclick="endCall()">✕</button>
      <span>Decline</span>
    </div>
    <div>
      <button class="call-btn accept" onclick="acceptCall()">📞</button>
      <span>Accept</span>
    </div>
  </div>
</div>

<script>
let selectedDelay = 0;

document.querySelectorAll('#delayRow button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#delayRow button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDelay = parseInt(btn.dataset.sec);
  });
});

function scheduleCall() {
  const name = document.getElementById('callerName').value.trim() || "Unknown";
  const number = document.getElementById('callerNumber').value.trim();

  document.getElementById('displayName').textContent = name;
  document.getElementById('displayNumber').textContent = number;
  document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();

  const countdownMsg = document.getElementById('countdownMsg');

  if (selectedDelay === 0) {
    triggerCall();
    return;
  }

  let remaining = selectedDelay;
  countdownMsg.textContent = `Call aayegi ${remaining} second mein...`;
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(interval);
      countdownMsg.textContent = "";
      triggerCall();
    } else {
      countdownMsg.textContent = `Call aayegi ${remaining} second mein...`;
    }
  }, 1000);
}

function triggerCall() {
  document.getElementById('callScreen').classList.add('show');
  if (navigator.vibrate) {
    navigator.vibrate([500, 300, 500, 300, 500]);
  }
}

function acceptCall() {
  document.getElementById('callStatus').textContent = "Call connected — 00:0" + Math.floor(Math.random()*9);
  if (navigator.vibrate) navigator.vibrate(50);
}

function endCall() {
  document.getElementById('callScreen').classList.remove('show');
  document.getElementById('callStatus').textContent = "Incoming call...";
}
</script>

</body>
</html>
